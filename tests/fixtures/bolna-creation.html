<!doctype html><html lang="en"><meta charset="utf-8"><title>Isolated creation rehearsal</title><style>body{font:15px Arial;margin:24px}button,input,select,textarea{padding:8px;margin:5px}label{display:block}textarea{width:600px;height:100px}#nodes{display:flex;gap:10px}article{border:1px solid #aaa;padding:12px}#inspector{background:#eef;padding:16px;max-width:700px}[hidden]{display:none}</style>
<p>Isolated fictional dashboard. This is a test fixture, not Bolna.</p><nav><a href="/dashboard">Agent Studio</a> <a href="/workflows">Workflows</a> <a href="/campaigns">Campaigns</a></nav><main></main><p id="status" role="status"></p>
<script>
const initial={agents:[],workflows:[],campaigns:[],counts:{agentCreates:0,workflowCreates:0,campaignCreates:0,saves:0,publishes:0,launches:0}};let db=JSON.parse(localStorage.lab||JSON.stringify(initial)),selected=null,source=null;const main=document.querySelector('main');const persist=()=>localStorage.lab=JSON.stringify(db);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const status=t=>document.querySelector('#status').textContent=t;
function route(p){history.pushState({},'',p);render()}function field(label,value,change,type='text'){return `<label>${label}<input aria-label="${label}" type="${type}" value="${esc(value)}" onchange="${change};persist()"></label>`}function choice(label,value,values,change){return `<label>${label}<select aria-label="${label}" onchange="${change};persist()">${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function render(){const path=location.pathname;status('');if(path==='/workflows/unpublished'){main.innerHTML='<h1>Unpublished sales draft</h1><p>Draft — never published. No published versions available.</p><button onclick=\"db.counts.publishes++;persist()\">Publish</button>';return;}if(path==='/dashboard'){main.innerHTML='<h1>Your Agents</h1><input aria-label="Search agents" type="search"><button onclick="newAgent()">New Agent</button>'+db.agents.map((a,i)=>`<button onclick="editAgent(${i})">${esc(a.name)} Agent options</button>`).join('');}else if(path.startsWith('/dashboard/'))editAgent(Number(path.split('/').at(-1)));else if(path==='/workflows'){main.innerHTML='<h1>Workflows</h1><a href="/workflows/unpublished">Unpublished sales draft</a><p>Draft — never published</p><input aria-label="Search workflows" type="search"><button onclick="newWorkflow()">Create</button>'+db.workflows.map((w,i)=>`<a href="/workflows/${i}">${esc(w.name)}</a>`).join('');}else if(path.startsWith('/workflows/')){selected=db.workflows[Number(path.split('/').at(-1))];workflow();}else if(path==='/campaigns'){main.innerHTML='<h1>Campaigns</h1><input aria-label="Name or ID" type="text"><button onclick="newCampaign()">New campaign</button>'+db.campaigns.map((c,i)=>`<a href="/campaigns/${i}">${esc(c.name||'Untitled campaign')}</a>`).join('');}else{selected=db.campaigns[Number(path.split('/').at(-1))];campaign();}}
function newAgent(){db.counts.agentCreates++;db.agents.push({name:'New Agent draft',welcome:'',prompt:'',temperature:0.2,tokens:250,saved:false});persist();route('/dashboard/'+(db.agents.length-1))}function editAgent(i){selected=db.agents[i];history.replaceState({},'', '/dashboard/'+i);main.innerHTML=`<h1>${esc(selected.name)} ${selected.saved?'Agent options':'draft'}</h1>${field('My Awesome Agent',selected.name,'selected.name=this.value')}<p>English(Default) · Cascaded · Default voice and telephony retained</p><button role="tab" onclick="agentTab('agent')">Agent</button><button role="tab" onclick="agentTab('intelligence')">Intelligence</button><section id="agent">${field('Agent Welcome Message',selected.welcome,'selected.welcome=this.value')}<label>Canvas<textarea aria-label="Canvas" onchange="selected.prompt=this.value;persist()">${esc(selected.prompt)}</textarea></label></section><section id="intelligence" hidden>${field('Temperature',selected.temperature,'selected.temperature=Number(this.value)','number')}${field('Output tokens',selected.tokens,'selected.tokens=Number(this.value)','number')}</section><button onclick="saveAgent()">Save agent</button>${selected.saved?'<a href="/agent-executions/fixture-agent">Call history</a><p>Updated · Saved agent</p>':''}`;}function agentTab(id){document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==id)}function saveAgent(){selected.saved=true;db.counts.saves++;persist();editAgent(db.agents.indexOf(selected));status('Agent saved successfully. Updated just now.')}
function newWorkflow(){db.counts.workflowCreates++;db.workflows.push({name:'Untitled workflow',field:'mobile_number',required:true,nodes:[],edges:[],published:false});persist();route('/workflows/'+(db.workflows.length-1))}function workflow(){main.innerHTML=`<button onclick="rename()">${esc(selected.name)}</button><p>Unpublished draft · Changes saved</p><button onclick="validate()">Validate</button><button onclick="db.counts.publishes++;persist();status('Published version 1')">Publish</button><div id="nodes"><article><button onclick="inspect('start')">Start</button><button aria-label="Add node after Start" onclick="addMenu('start')">+</button></article>${selected.nodes.map(n=>`<article><button onclick="inspect('${n.id}')">${esc(n.name)}</button><p>${n.kind}</p><button aria-label="Add node after ${esc(n.name)}" onclick="addMenu('${n.id}')">+</button></article>`).join('')}</div><p>${selected.edges.map(e=>'Edge from '+e[0]+' to '+e[1]).join(' · ')}</p><div id="inspector" hidden></div>`;}function rename(){const b=main.querySelector('button');b.outerHTML=`<input aria-label="Rename workflow" value="${esc(selected.name)}" onkeydown="if(event.key==='Enter'){selected.name=this.value;persist();workflow()}">`;main.querySelector('input').focus()}
function inspect(id){const p=document.querySelector('#inspector');p.hidden=false;if(id==='start')p.innerHTML=`<button onclick="this.parentNode.hidden=true">Close inspector</button><h2>Start settings</h2>${field('Field 1 name',selected.field,'selected.field=this.value;inspect(\'start\')')}<p>Field 1 type: ${selected.field==='mobile_number'?'phone':'text'}</p><label><input aria-label="Field 1 required" type="checkbox" ${selected.required?'checked':''} onchange="selected.required=this.checked;persist()">Required</label>`;else{const n=selected.nodes.find(n=>n.id===id);window.node=n;p.innerHTML=`<button onclick="this.parentNode.hidden=true">Close inspector</button><h2>${n.kind} settings</h2>${field('Node name',n.name,'renameNode(this.value)')}}`+(n.kind==='Agent'?choice('Agent',n.agent,['Select agent','Nova Demo — Workflow Lab'],'node.agent=this.value'):n.kind==='Wait'?field('Wait',n.delay,'node.delay=Number(this.value)','number')+choice('Unit',n.unit,['minutes','hours','days'],'node.unit=this.value'):choice('Outcome',n.outcome,['Unhandled','success','failure','neutral'],'node.outcome=this.value'));}}
function renameNode(value){node.name=value;const a=document.querySelectorAll('#nodes article')[selected.nodes.indexOf(node)+1];a.querySelector('button').textContent=value;a.querySelectorAll('button')[1].setAttribute('aria-label','Add node after '+value)}
function addMenu(id){source=id;const p=document.querySelector('#inspector');p.hidden=false;p.innerHTML='<h2>Adding after '+esc(id)+'</h2>'+['Agent','Wait','End'].map(k=>`<button onclick="addNode('${k}')">${k}</button>`).join('')}function addNode(kind){const id=kind.toLowerCase()+'_'+(selected.nodes.length+1);selected.nodes.push({id,kind,name:kind,agent:'Select agent',delay:30,unit:'minutes',outcome:'Unhandled'});selected.edges.push([source,id]);persist();workflow();inspect(id)}function validate(){const n=selected.nodes;const errors=[];if(!selected.field||!selected.required)errors.push('Required batch field missing');if(!n.length||n.at(-1).kind!=='End')errors.push('Missing End');if(n.some(n=>n.kind==='Agent'&&n.agent==='Select agent'))errors.push('Agent selection required');if(n.some(n=>n.kind==='End'&&n.outcome==='Unhandled'))errors.push('End outcome required');if(selected.edges.length!==n.length)errors.push('Disconnected node');status(errors.length?'Validation errors: '+errors.join('; '):'No issues found');}
function newCampaign(){db.counts.campaignCreates++;db.campaigns.push({name:'',workflow:'Select workflow',version:'Select version'});persist();route('/campaigns/'+(db.campaigns.length-1))}function campaign(){main.innerHTML='<h1>New campaign</h1>'+field('Campaign name',selected.name,'selected.name=this.value')+choice('Workflow',selected.workflow,['Select workflow','Nova Demo — No-contact Workflow Lab','Unpublished sales draft'],'selected.workflow=this.value;selected.version=\'Select version\';campaign()')+(selected.workflow==='Unpublished sales draft'?'<p>No published versions available. Publish a validated workflow before configuring contacts.</p>':selected.workflow==='Nova Demo — No-contact Workflow Lab'?choice('Version',selected.version,['Select version','Version 1 · latest'],'selected.version=this.value;campaign()'):'')+(selected.version==='Version 1 · latest'?'<p>Draft saved · Workflow version selected · Contacts required</p><a download="template.csv" href="data:text/csv,reference_id">Column template · v1</a><label>Contacts<input type="file" aria-label="Contacts CSV or JSON" accept=".csv,.json"></label><p>CSV or JSON · up to 32 MB / 150,000 rows. No file selected. No recipients uploaded.</p>':'')+'<button disabled>Launch campaign</button>';}
persist();render();
</script></html>
