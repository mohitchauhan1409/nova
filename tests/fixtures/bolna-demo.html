<!doctype html><html lang="en"><meta charset="utf-8"><title>Bolna fictional rehearsal fixture</title><style>body{font:16px Arial;padding:30px}button,input,textarea{padding:12px;margin:8px}label{display:block}textarea{width:650px;height:100px}[hidden]{display:none}</style><h1>Nova Demo — Workflow Lab</h1><p>Isolated fictional workspace, no customer data or external dispatch.</p><a href="/workflows/demo">Nova Demo — Guided Workflow</a><nav><button role="tab" onclick="tab('agent')">Agent</button><button role="tab" onclick="tab('intelligence')">Intelligence</button><button role="tab" onclick="tab('extractions')">Extractions</button></nav>
<section id="agent"><h2>Agent Welcome Message</h2><input aria-label="Agent Welcome Message" id="welcome" placeholder="Hey there!"></section>
<section id="intelligence" hidden><h2>Intelligence</h2><label>Provider<select><option>Test provider</option></select></label><label>Model<select><option>Test model</option></select></label><label>Temperature<input id="temperature" type="number" step="0.1" value="0.2"></label><label>Output tokens<input id="tokens" type="number" value="250"></label></section>
<section id="extractions" hidden><h2>Nova Demo Outcome</h2><h3>demo_request_type</h3><button onclick="document.querySelector('#test').hidden=false">Test demo_request_type</button><div id="test" hidden><label>Transcript<textarea id="transcript"></textarea></label><button onclick="runTest()">Run Test</button><div id="result"></div></div></section><button onclick="save()">Save agent</button><p id="saved">Saved agent</p><p id="counts"></p>
<script>let saves=0,writes=0,tests=0;function counts(){document.querySelector('#counts').textContent=`Saves: ${saves}. Field changes: ${writes}. Extraction tests: ${tests}. Calls: 0.`}counts();document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('change',()=>{writes++;counts()}));function tab(id){document.querySelectorAll('section').forEach(e=>e.hidden=e.id!==id)}function save(){const clone=welcome.cloneNode(true);welcome.replaceWith(clone);saves++;counts();localStorage.saved=JSON.stringify({welcome:welcome.value,temperature:temperature.value,tokens:tokens.value});document.querySelector('#saved').textContent=`Agent saved successfully. Temperature ${temperature.value}; output tokens ${tokens.value}.`}function runTest(){tests++;counts();result.textContent='Running Test…';setTimeout(()=>{const v=transcript.value.toLowerCase();result.textContent='Extraction Results objective: '+(v.includes('consultation')?'consultation':v.includes('open')?'hours':'other')+'; confidence: 1; label: High.'},200)}
</script></html>
