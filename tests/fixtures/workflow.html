<!doctype html><html><head><title>Workflow regression</title><style>body{font:16px Arial;padding:25px}button,input{padding:12px;margin:8px}#inspector{position:fixed;right:0;top:0;background:#eee;padding:20px;width:380px;height:95vh}#menu{background:white;padding:10px}#canvas{display:flex;width:850px;justify-content:space-between;margin-top:100px}label{display:block}</style></head><body><h1>Nova Demo — Guided Workflow</h1><p>Unpublished draft. Start → Demo pause → Demo complete.</p><button onclick="document.querySelector('#validation').textContent='No issues found'">Validate</button><p id="validation"></p><div id="canvas"><button onclick="inspect('start')">Start</button><button onclick="inspect('wait')">Demo pause</button><button onclick="inspect('end')">Demo complete</button></div><div id="inspector" hidden></div><p id="counts"></p><script>
let config=JSON.parse(localStorage.config||'{"delay":30,"unit":"minutes","outcome":"success","field":"reference_id","required":true}');let writes=+(localStorage.writes||0);let visits=+(localStorage.visits||0)+1;localStorage.visits=visits;
function count(){document.querySelector('#counts').textContent=`Setting writes: ${writes}. Page loads: ${visits}.`;}count();
function save(key,value){if(config[key]!==value){config[key]=value;localStorage.config=JSON.stringify(config);localStorage.writes=++writes;count();}}
function inspect(kind){const p=document.querySelector('#inspector');p.hidden=false;p.innerHTML='<button onclick="this.parentNode.hidden=true">Close inspector</button>'+(kind==='start'?`<h2>Start settings</h2><label>Field 1 name<input aria-label="Field 1 name" value="${config.field}" oninput="save('field',this.value)"></label><label>Field 1 type<select aria-label="Field 1 type"><option>text</option></select></label><label><input type="checkbox" aria-label="Required" ${config.required?'checked':''} onchange="save('required',this.checked)">Required</label>`:kind==='wait'?`<h2>Wait settings</h2><label>Wait<input aria-label="Wait" type="number" value="${config.delay}" oninput="save('delay',Number(this.value))"></label><button role="combobox" aria-label="Unit" aria-expanded="false" onclick="menu(this,'unit',['minutes','hours','days'])">${config.unit}</button>`:`<h2>End settings</h2><button role="combobox" aria-label="Outcome" aria-expanded="false" onclick="menu(this,'outcome',['success','failure'])">${config.outcome}</button>`);}
function menu(el,key,options){if(document.querySelector('#menu'))return;el.setAttribute('aria-expanded','true');const d=document.createElement('div');d.id='menu';d.role='listbox';d.innerHTML=options.map(v=>`<button role="option" aria-selected="${v===config[key]}" onclick="save('${key}','${v}');this.parentNode.previousElementSibling.textContent='${v}';closeMenu()">${v}</button>`).join('');el.after(d);}
function closeMenu(){document.querySelector('#menu')?.remove();document.querySelector('[aria-expanded="true"]')?.setAttribute('aria-expanded','false');}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
// Start in the exact stuck condition: open wait unit menu.
inspect('wait');menu(document.querySelector('[role="combobox"]'),'unit',['minutes','hours','days']);
</script></body></html>
